name: deploy
on:
    push:
        branches:
          - master
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
          - name: checkout code
            uses: actions/checkout@v3
            with:
                fetch-depth: 0
          - name: get changed files
            id: changed-files
            run: |
              # Get only added (A), modified (M), or renamed (R) files
              git diff --name-status HEAD^ | awk '$1 != "D" {print $2}' |
              grep -vEi '^\.git/|^\.github/|^bootstrap/|^\.editorconfig$|^\.gitattributes$|^\.styleci\.yml$|^CHANGELOG\.md$|^artisan package\.json$|^phpunit\.xml$|^webpack\.mix\.js$|^\.env-example$|^\.gitignore$|^\.htaccess$|^composer\.json$|^composer\.lock$|^readme\.md$|^web\.config$|^storage/' > changed_files.txt || true

              echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT

          - name: deploy changed files only
            uses: sherz12r/deploy@master
            with:
                switches: -avz --files-from=changed_files.txt
                # switches: -avz --no-perms --no-owner --no-group --exclude=".git" --exclude=".github/" --exclude="bootstrap" --exclude=".editorconfig" --exclude=".gitattributes" --exclude=".styleci.yml" --exclude="CHANGELOG.md" --exclude="artisan package.json" --exclude="phpunit.xml" --exclude="webpack.mix.js" --exclude=".env-example" --exclude=".gitignore" --exclude=".htaccess" --exclude="composer.json" --exclude="composer.lock" --exclude="readme.md" --exclude="web.config" --exclude="storage"
                # path: /
                remote_path: ${{ secrets.SERVER_PATH }}/
                remote_host: ${{ secrets.SERVER }}
                # remote_port: ${{ secrets.DEPLOY_PORT }}
                remote_user: ${{ secrets.USER_NAME }}
                remote_key: ${{ secrets.SSH_KEY }}
                remote_key_pass: ${{ secrets.SSH_KEY_PASS }}

          - name: restart cPanel application
            uses: appleboy/ssh-action@v1.2.0
            env:
                APP_ROOT: ${{ secrets.SERVER_PATH }}
            with:
                host: ${{ secrets.SERVER }}
                username: ${{ secrets.USER_NAME }}
                key: ${{ secrets.SSH_KEY }}
                passphrase: ${{ secrets.SSH_KEY_PASS }}
                envs: APP_ROOT
                script: |
                  set -eu
                  test -n "$APP_ROOT"
                  cd -- "$APP_ROOT"
                  test -f app.cjs
                  test -f dist/standalone/server.js
                  mkdir -p tmp
                  touch tmp/restart.txt
                  echo "Passenger restart requested."
