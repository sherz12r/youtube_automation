name: Build and deploy to cPanel

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cpanel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone production app
        run: npm run build

      - name: Verify deployable output
        run: test -f dist/standalone/server.js

      # Only dist/standalone contents are sent to cPanel.
      # Source code, Git metadata and workflow files remain on GitHub.
      - name: Deploy production build only
        uses: sherz12r/deploy@master
        with:
          path: dist/standalone/
          switches: -avzr
          remote_path: ${{ secrets.SERVER_PATH }}/
          remote_host: ${{ secrets.SERVER }}
          remote_user: ${{ secrets.USER_NAME }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_key_pass: ${{ secrets.SSH_KEY_PASS }}

      - name: Restart cPanel Node application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASS }}
          script: |
            mkdir -p "${{ secrets.SERVER_PATH }}/tmp"
            touch "${{ secrets.SERVER_PATH }}/tmp/restart.txt"
