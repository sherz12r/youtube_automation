name: Deploy to cPanel

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an upload or let two deployments modify the app together.
concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare application files
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import subprocess

          # Sync the current tracked application, not just the latest commit diff.
          # This also recovers files from failed or superseded deployments.
          tracked = subprocess.check_output(["git", "ls-files", "-z"])
          files = []
          for raw in tracked.split(b"\0"):
              if not raw:
                  continue
              path = PurePosixPath(raw.decode("utf-8"))
              application_file = path.parts[0] in {"seobot", "templates", "static", "migrations"}
              application_file |= len(path.parts) == 1 and (path.suffix == ".py" or path.name in {"requirements.txt", "requirements-cpanel.txt"})
              if application_file and "__pycache__" not in path.parts and path.suffix != ".pyc":
                  files.append(raw)
          Path("deploy_files.txt").write_bytes(b"\0".join(files) + b"\0")
          print(f"Prepared {len(files)} application files.")

      - name: Deploy application files
        uses: sherz12r/deploy@master
        with:
          # Checksums transfer only changed content. No deletion of server data.
          # switches: -avzc --exclude=".git/" --exclude=".github/" --exclude=".gitignore" --exclude="readme.md" --exclude=".claude" --from0 --files-from=deploy_files.txt
          switches: -avzr --exclude=".git/" --exclude=".github/" --exclude=".gitignore" --exclude="readme.md" --exclude=".claude"
          remote_path: ${{ secrets.SERVER_PATH }}/
          remote_host: ${{ secrets.SERVER }}
          remote_user: ${{ secrets.USER_NAME }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_key_pass: ${{ secrets.SSH_KEY_PASS }}

